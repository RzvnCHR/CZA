<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CZA Automobile</title>
<style>
  :root{
    --gold: #d4af37;
    --gold-light: #f5e6a8;
    --gold-dark: #8a6d1f;
    --silver: #c9ccd1;
    --silver-light: #f2f3f5;
    --bg: #060606;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
  }

  body{
    font-family: 'Georgia', 'Times New Roman', serif;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* Subtle vignette + radial glow behind logos */
  .glow{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 45%, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(ellipse 120% 100% at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
    z-index:2;
  }

  canvas#flakes{
    position:fixed;
    inset:0;
    z-index:1;
    display:block;
  }

  .stage{
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:40px 24px;
    max-width:90vw;
  }

  .tagline{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:clamp(11px, 1.6vw, 15px);
    letter-spacing:0.45em;
    text-transform:uppercase;
    font-weight:400;
    margin-bottom:28px;
    background: linear-gradient(180deg, var(--silver-light) 0%, var(--silver) 50%, var(--gold-light) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation: fadeDown 1.4s ease forwards 0.3s;
  }

  .my-logo{
height: clamp(32px, 4.5vw, 52px);
    width:auto;
    margin-bottom:18px;
    opacity:0;
    filter: drop-shadow(0 0 14px rgba(212,175,55,0.25));
    animation: fadeIn 1.4s ease forwards 0.7s;
  }

  .divider{
    width:1px;
    height:44px;
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    margin-bottom:36px;
    opacity:0;
    animation: fadeIn 1.4s ease forwards 1s;
  }

  .client-logo{
    height: clamp(90px, 14vw, 170px);
    width:auto;
    margin-bottom:34px;
    opacity:0;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.18));
    animation: fadeInUp 1.6s ease forwards 1.2s;
  }

  .site-name{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:clamp(20px, 3.4vw, 34px);
    letter-spacing:0.18em;
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:18px;
    background: linear-gradient(180deg, #ffffff 0%, var(--silver-light) 35%, var(--silver) 60%, #ffffff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 0 30px rgba(255,255,255,0.08);
    opacity:0;
    animation: fadeInUp 1.6s ease forwards 1.6s;
  }

  .site-phone{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:clamp(13px, 2vw, 20px);
    letter-spacing:0.18em;
    font-weight:600;
    text-transform:uppercase;
    margin-top:-8px;
    background: linear-gradient(180deg, #ffffff 0%, var(--silver-light) 35%, var(--silver) 60%, #ffffff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(255,255,255,0.08);
    opacity:0;
    animation:fadeInUp 1.6s ease forwards 1.8s;
}

  .status{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:12px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:clamp(11px, 1.8vw, 14px);
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-weight:300;
    color: var(--gold-light);
    opacity:0;
    animation: fadeInUp 1.6s ease forwards 2s;
  }

  .status::before,
  .status::after{
    content:"";
    width:26px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .status::after{
    background: linear-gradient(90deg, var(--gold), transparent);
  }

  .status .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 8px 2px rgba(212,175,55,0.6);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .cta-wrap{
    margin-top:40px;
    opacity:0;
    animation: fadeInUp 1.6s ease forwards 2.3s;
  }

  .cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:14px;
    padding:16px 40px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:clamp(11px, 1.6vw, 13px);
    letter-spacing:0.28em;
    text-transform:uppercase;
    font-weight:600;
    text-decoration:none;
    color:#0a0a0a;
    background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 25%, var(--gold-light) 50%, var(--gold) 75%, var(--gold-dark) 100%);
    background-size: 250% 250%;
    border-radius:2px;
    overflow:hidden;
    isolation:isolate;
    transition: transform 0.45s cubic-bezier(.2,.9,.3,1), box-shadow 0.45s ease, background-position 1.2s ease;
    box-shadow:
      0 0 0 1px rgba(212,175,55,0.5),
      0 8px 24px -8px rgba(212,175,55,0.35),
      inset 0 1px 0 rgba(255,255,255,0.4);
    background-position: 0% 50%;
  }

  .cta::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.75) 48%, rgba(255,255,255,0.75) 52%, transparent 70%);
    transform: translateX(-140%);
    transition: transform 0.9s ease;
  }

  .cta .arrow{
    display:inline-block;
    transition: transform 0.4s cubic-bezier(.2,.9,.3,1);
    font-size:14px;
    line-height:1;
  }

  .cta:hover{
    transform: translateY(-3px);
    background-position: 100% 50%;
    box-shadow:
      0 0 0 1px rgba(245,230,168,0.8),
      0 14px 34px -8px rgba(212,175,55,0.55),
      inset 0 1px 0 rgba(255,255,255,0.55);
  }

  .cta:hover::before{
    transform: translateX(140%);
  }

  .cta:hover .arrow{
    transform: translateX(5px);
  }

  .cta:focus-visible{
    outline: 2px solid var(--gold-light);
    outline-offset: 4px;
  }

  .cta:active{
    transform: translateY(-1px) scale(0.98);
  }

  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes fadeDown{
    from{ opacity:0; transform:translateY(-10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulse{
    0%, 100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.4; transform:scale(0.75); }
  }

  footer.brand-credit{
    position:fixed;
    bottom:22px;
    left:0; right:0;
    text-align:center;
    z-index:5;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:10px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color: rgba(201,204,209,0.35);
    opacity:0;
    animation: fadeIn 1.6s ease forwards 2.4s;
  }
  .brand-credit a{
  color:inherit !important;
  text-decoration:none !important;
  cursor:pointer;
}

  @media (prefers-reduced-motion: reduce){
    canvas#flakes{ display:none; }
    .status .dot{ animation:none; }
    *{ animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

  <canvas id="flakes"></canvas>
  <div class="glow"></div>

  <main class="stage">
    <div class="tagline">From the Best, For the Best.</div>

    <a href="https://www.scalamafaceri.ro/" target="_blank" rel="noopener">
  <img class="my-logo" src="logo-scalam.png" alt="SCALAMAFACERI.RO">
</a>

    <div class="divider"></div>

    <img class="client-logo" src="cza-logo.png" alt="CZA Automobile">

    <div class="site-name">CZAAUTOMOBILE.RO</div>
    <div class="site-phone">0727 982 772</div>
    <div class="status"></span>Website în lucru</div>

    <div class="cta-wrap">
      <a class="cta" href="https://czaautomobile.autovit.ro/inventory" target="_blank" rel="noopener">
        Vezi catalog Autovit
        <span class="arrow">→</span>
      </a>
    </div>
  </main>

<footer class="brand-credit">
  <a href="https://www.scalamafaceri.ro/" target="_blank" rel="noopener">
    SCALAMAFACERI.RO
  </a>
</footer>

<script>
(function(){
  const canvas = document.getElementById('flakes');
  const ctx = canvas.getContext('2d');
  let width, height, flakes = [];

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function createFlake(){
    return {
      x: rand(0, width),
      y: rand(-height, 0),
      size: rand(1.5, 4.5),
      speedY: rand(0.3, 1.1),
      speedX: rand(-0.3, 0.3),
      drift: rand(0, Math.PI * 2),
      driftSpeed: rand(0.005, 0.02),
      opacity: rand(0.25, 0.9),
      spin: rand(0, Math.PI * 2),
      spinSpeed: rand(-0.02, 0.02)
    };
  }

  const FLAKE_COUNT = Math.min(50, Math.floor((window.innerWidth * window.innerHeight) / 12000));
  for(let i=0; i<FLAKE_COUNT; i++){ flakes.push(createFlake()); }

  function drawFlake(f){
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.spin);
    ctx.globalAlpha = f.opacity;

    const grad = ctx.createRadialGradient(0,0,0, 0,0,f.size*2.2);
    grad.addColorStop(0, 'rgba(255, 240, 200, 1)');
    grad.addColorStop(0.4, 'rgba(212, 175, 55, 0.85)');
    grad.addColorStop(1, 'rgba(138, 109, 31, 0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, f.size, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function animate(){
    ctx.clearRect(0, 0, width, height);

    for(const f of flakes){
      f.y += f.speedY;
      f.drift += f.driftSpeed;
      f.x += f.speedX + Math.sin(f.drift) * 0.4;
      f.spin += f.spinSpeed;

      if(f.y > height + 10){
        f.y = -10;
        f.x = rand(0, width);
      }
      if(f.x > width + 10) f.x = -10;
      if(f.x < -10) f.x = width + 10;

      drawFlake(f);
    }

    if(!prefersReducedMotion){
      requestAnimationFrame(animate);
    }
  }

  animate();
})();
</script>

</body>
</html>
